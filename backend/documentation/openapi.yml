openapi: 3.1.1
info:
  title: NASAM Backend API
  description: |
    NASAM (Nasionalismo Assessment and Management) Backend API Documentation
    
    This API provides comprehensive functionality for managing user applications, 
    interviews, evaluations, documents, and administrative tasks for the NASAM system.
    
    ## Authentication
    Most endpoints require authentication using JWT tokens passed in cookies.
    
    ## Permissions
    The API uses a role-based permission system. Users must have specific permissions
    to access different endpoints.
    
    ## Data Formats
    - All dates should be in ISO 8601 format
    - File uploads use multipart/form-data
    - JSON responses follow consistent error handling patterns
  version: 1.0.0
  contact:
    name: NASAM Development Team
    email: support@nasam.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.nasam.example.com
    description: Production server

security:
  - cookieAuth: []

