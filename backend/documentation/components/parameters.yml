id:
  name: id
  in: path
  required: true
  schema:
    type: string
  description: Resource ID

userId:
  name: userId
  in: path
  required: true
  schema:
    type: string
  description: User ID

page:
  name: page
  in: query
  schema:
    type: integer
    default: 1
  description: Page number

limit:
  name: limit
  in: query
  schema:
    type: integer
    default: 10
  description: Items per page

search:
  name: search
  in: query
  schema:
    type: string
  description: Search term

sortBy:
  name: sortBy
  in: query
  schema:
    type: string
  description: Field to sort by

sortOrder:
  name: sortOrder
  in: query
  schema:
    type: string
    enum: [asc, desc]
    default: desc
  description: Sort order
