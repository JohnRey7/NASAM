/api/documents:
  put:
    tags:
      - Documents
    summary: Upload documents
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              files:
                type: array
                items:
                  type: string
                  format: binary
    responses:
      '200':
        description: Documents uploaded
  get:
    tags:
      - Documents
    summary: Get documents
    security:
      - cookieAuth: []
    responses:
      '200':
        description: List of documents
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yml#/Document'
  delete:
    tags:
      - Documents
    summary: Delete documents
    security:
      - cookieAuth: []
    responses:
      '200':
        $ref: '../components/responses.yml#/DeletedResponse'

/api/documents/{id}/soft:
  delete:
    tags:
      - Documents
    summary: Soft delete document
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        $ref: '../components/responses.yml#/DeletedResponse'

/api/documents/{id}/restore:
  put:
    tags:
      - Documents
    summary: Restore soft deleted document
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        description: Document restored

/api/documents/{id}/permanent:
  delete:
    tags:
      - Documents
    summary: Permanently delete document
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        $ref: '../components/responses.yml#/DeletedResponse'

/api/documents/deleted:
  get:
    tags:
      - Documents
    summary: Get soft deleted documents
    security:
      - cookieAuth: []
    responses:
      '200':
        description: List of deleted documents
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yml#/Document'

