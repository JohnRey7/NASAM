      '500':
        $ref: '../components/responses.yml#/InternalServerError'

/api/users/{id}/permanent:
  delete:
    tags:
      - Users
    summary: Permanently delete user
    description: Permanently delete a user (cannot be restored)
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        $ref: '../components/responses.yml#/DeletedResponse'
