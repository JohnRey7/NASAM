/api/users/{id}/soft:
  delete:
    tags:
      - Users
    summary: Soft delete user
    description: Soft delete a user (can be restored later)
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        $ref: '../components/responses.yml#/DeletedResponse'
      '401':
