      '500':
        $ref: '../components/responses.yml#/InternalServerError'

/api/users/{id}/restore:
  put:
    tags:
      - Users
    summary: Restore soft-deleted user
    description: Restore a soft-deleted user
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        description: User restored successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "User restored successfully"
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
