/api/audit-logs/cleanup:
  post:
    tags:
      - Audit Logs
    summary: Cleanup old audit logs
    description: Permanently delete old soft-deleted audit logs for maintenance
    security:
      - cookieAuth: []
    parameters:
      - name: daysToKeep
        in: query
        required: false
        description: Number of days to keep logs (default 90)
        schema:
          type: number
          minimum: 1
          default: 90
        example: 90
    responses:
      '200':
        description: Old audit logs cleaned up successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Cleaned up 150 old audit logs"
                data:
                  type: object
                  properties:
                    deletedCount:
                      type: number
                      example: 150
                    daysToKeep:
                      type: number
                      example: 90
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'