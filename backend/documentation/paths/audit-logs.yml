/api/audit-logs/stats:
  get:
    tags:
      - Audit Logs
    summary: Get audit log statistics
    description: Retrieve audit log statistics and analytics
    security:
      - cookieAuth: []
    parameters:
      - name: startDate
        in: query
        required: false
        description: Statistics from date
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        required: false
        description: Statistics to date
        schema:
          type: string
          format: date-time
      - name: userId
        in: query
        required: false
        description: Filter statistics by user
        schema:
          type: string
      - name: resourceType
        in: query
        required: false
        description: Filter statistics by resource type
        schema:
          type: string
    responses:
      '200':
        description: Audit log statistics retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Audit log statistics retrieved successfully"
                data:
                  type: object
                  properties:
                    summary:
                      type: object
                      properties:
                        totalLogs:
                          type: number
                          example: 1500
                        uniqueUsers:
                          type: number
                          example: 25
                        avgDuration:
                          type: number
                          example: 245.67
                    actionBreakdown:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: string
                            example: "User Login"
                          count:
                            type: number
                            example: 150
                    methodBreakdown:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: string
                            example: "GET"
                          count:
                            type: number
                            example: 800
                    statusBreakdown:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: number
                            example: 200
                          count:
                            type: number
                            example: 1200
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

/api/audit-logs/{id}:
  get:
    tags:
      - Audit Logs
    summary: Get audit log by ID
    description: Retrieve a specific audit log by its ID
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
      - name: includeDeleted
        in: query
        required: false
        description: Include soft-deleted log
        schema:
          type: boolean
    responses:
      '200':
        description: Audit log retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Audit log retrieved successfully"
                data:
                  $ref: '../components/schemas.yml#/AuditLog'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '404':
        $ref: '../components/responses.yml#/NotFound'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

  patch:
    tags:
      - Audit Logs
    summary: Update audit log
    description: Update limited fields of an audit log entry
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              metadata:
                type: object
                description: Additional metadata
              responseMessage:
                type: string
                description: Updated response message
                example: "Updated response message"
    responses:
      '200':
        $ref: '../components/responses.yml#/UpdatedResponse'
      '400':
        $ref: '../components/responses.yml#/ValidationError'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '404':
        $ref: '../components/responses.yml#/NotFound'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

/api/audit-logs/{id}/soft:
