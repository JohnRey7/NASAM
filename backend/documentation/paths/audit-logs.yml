# Audit Log Routes
/api/audit-logs:
  post:
    tags:
      - Audit Logs
    summary: Create audit log entry
    description: Create a new audit log entry (typically used for manual logging)
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              action:
                type: string
                description: Action performed
                example: "Manual user creation"
              method:
                type: string
                enum: [GET, POST, PUT, PATCH, DELETE]
                description: HTTP method
                example: "POST"
              endpoint:
                type: string
                description: API endpoint
                example: "/api/users"
              resourceType:
                type: string
                description: Type of resource affected
                example: "user"
              resourceId:
                type: string
                description: ID of the affected resource
                example: "507f1f77bcf86cd799439011"
              responseStatus:
                type: number
                description: HTTP response status code
                example: 201
              responseMessage:
                type: string
                description: Response message
                example: "User created successfully"
              metadata:
                type: object
                description: Additional metadata
                example: { "source": "admin_panel", "category": "user_management" }
            required:
              - action
              - method
              - endpoint
              - responseStatus
    responses:
      '201':
        description: Audit log created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Audit log created successfully"
                data:
                  $ref: '../components/schemas.yml#/AuditLog'
      '400':
        $ref: '../components/responses.yml#/ValidationError'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

  get:
    tags:
      - Audit Logs
    summary: Get all audit logs
    description: Retrieve all audit logs with filtering and pagination (admin only)
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/page'
      - $ref: '../components/parameters.yml#/limit'
      - name: userId
        in: query
        required: false
        description: Filter by user ID
        schema:
          type: string
      - name: action
        in: query
        required: false
        description: Filter by action (partial match)
        schema:
          type: string
        example: "login"
      - name: method
        in: query
        required: false
        description: Filter by HTTP method
        schema:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
      - name: endpoint
        in: query
        required: false
        description: Filter by endpoint (partial match)
        schema:
          type: string
        example: "/api/users"
      - name: resourceType
        in: query
        required: false
        description: Filter by resource type
        schema:
          type: string
        example: "user"
      - name: resourceId
        in: query
        required: false
        description: Filter by resource ID
        schema:
          type: string
      - name: responseStatus
        in: query
        required: false
        description: Filter by response status code
        schema:
          type: number
        example: 200
      - name: ipAddress
        in: query
        required: false
        description: Filter by IP address
        schema:
          type: string
      - name: startDate
        in: query
        required: false
        description: Filter from date (ISO 8601)
        schema:
          type: string
          format: date-time
        example: "2024-01-01T00:00:00Z"
      - name: endDate
        in: query
        required: false
        description: Filter to date (ISO 8601)
        schema:
          type: string
          format: date-time
        example: "2024-12-31T23:59:59Z"
      - $ref: '../components/parameters.yml#/search'
      - $ref: '../components/parameters.yml#/sortBy'
      - $ref: '../components/parameters.yml#/sortOrder'
      - name: includeDeleted
        in: query
        required: false
        description: Include soft-deleted logs
        schema:
          type: boolean
        example: false
    responses:
      '200':
        description: Audit logs retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Audit logs retrieved successfully"
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/AuditLog'
                pagination:
                  type: object
                  properties:
                    current:
                      type: number
                      example: 1
                    pages:
                      type: number
                      example: 10
                    total:
                      type: number
                      example: 100
                    limit:
                      type: number
                      example: 10
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

