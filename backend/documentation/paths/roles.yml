# Role Management Routes
/api/roles:
  post:
    tags:
      - Roles
    summary: Create new role
    description: Create a new role with permissions
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Role name
                example: "Department Head"
              description:
                type: string
                description: Role description
                example: "Department head with administrative permissions"
              permissions:
                type: array
                items:
                  type: string
                description: Array of permission strings
                example: ["user.read", "application.read", "interview.create"]
            required:
              - name
    responses:
      '201':
        $ref: '../components/responses.yml#/CreatedResponse'
      '400':
        $ref: '../components/responses.yml#/ValidationError'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '409':
        $ref: '../components/responses.yml#/ConflictError'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

  get:
    tags:
      - Roles
    summary: Get all roles
    description: Retrieve all roles with pagination and filtering
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/page'
      - $ref: '../components/parameters.yml#/limit'
      - $ref: '../components/parameters.yml#/search'
      - $ref: '../components/parameters.yml#/includeDeleted'
    responses:
      '200':
        description: List of roles
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Role'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

/api/roles/{id}:
  get:
    tags:
      - Roles
    summary: Get role by ID
    description: Retrieve a specific role by its ID
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        description: Role data
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '../components/schemas.yml#/Role'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '404':
        $ref: '../components/responses.yml#/NotFound'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

  patch:
    tags:
      - Roles
    summary: Update role
    description: Update an existing role
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Role name
                example: "Updated Role Name"
              description:
                type: string
                description: Role description
                example: "Updated role description"
              permissions:
                type: array
                items:
                  type: string
                description: Array of permission strings
                example: ["user.read", "application.read"]
    responses:
      '200':
        $ref: '../components/responses.yml#/UpdatedResponse'
      '400':
        $ref: '../components/responses.yml#/ValidationError'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '404':
        $ref: '../components/responses.yml#/NotFound'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

  delete:
    tags:
      - Roles
    summary: Delete role
    description: Soft delete a role
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        $ref: '../components/responses.yml#/DeletedResponse'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '404':
        $ref: '../components/responses.yml#/NotFound'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

/api/roles/{id}/soft:
  delete:
    tags:
      - Roles
    summary: Soft delete role
    description: Soft delete a role (can be restored later)
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        $ref: '../components/responses.yml#/DeletedResponse'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '404':
        $ref: '../components/responses.yml#/NotFound'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

/api/roles/{id}/restore:
  put:
    tags:
      - Roles
    summary: Restore soft-deleted role
    description: Restore a soft-deleted role
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        description: Role restored successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Role restored successfully"
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '404':
        $ref: '../components/responses.yml#/NotFound'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

/api/roles/{id}/permanent:
  delete:
    tags:
      - Roles
    summary: Permanently delete role
    description: Permanently delete a role (cannot be restored)
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/id'
    responses:
      '200':
        $ref: '../components/responses.yml#/DeletedResponse'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '404':
        $ref: '../components/responses.yml#/NotFound'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'

/api/roles/deleted:
  get:
    tags:
      - Roles
    summary: Get soft-deleted roles
    description: Retrieve all soft-deleted roles
    security:
      - cookieAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/page'
      - $ref: '../components/parameters.yml#/limit'
    responses:
      '200':
        description: List of soft-deleted roles
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Role'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
      '403':
        $ref: '../components/responses.yml#/Forbidden'
      '500':
        $ref: '../components/responses.yml#/InternalServerError'