interview:
  post:
    tags:
      - Interviews
    summary: Create an interview for my application
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - date
              - startTime
              - endTime
            properties:
              date:
                type: string
                format: date
              startTime:
                type: string
              endTime:
                type: string
              type:
                type: string
                enum: [Online, Face-to-Face]
    responses:
      '201':
        description: Interview created successfully
      '400':
        description: Bad request
  get:
    tags:
      - Interviews
    summary: Get my interview
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '200':
        description: Interview retrieved successfully
      '404':
        description: Interview not found
  patch:
    tags:
      - Interviews
    summary: Update my interview
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: Interview updated successfully
  delete:
    tags:
      - Interviews
    summary: Delete my interview
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '200':
        description: Interview deleted successfully

