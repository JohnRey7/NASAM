/api/oas/applications:
  get:
    tags:
      - OAS
    summary: Get all applications (Staff)
    security:
      - cookieAuth: []
    responses:
      '200':
        description: List of applications
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yml#/ApplicationForm'

/api/oas/application/{applicationId}/documents:
  get:
    tags:
      - OAS
    summary: Get application documents
    security:
      - cookieAuth: []
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: List of documents
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yml#/Document'

/api/oas/application/{applicationId}/status:
  patch:
    tags:
      - OAS
    summary: Update application status
    security:
      - cookieAuth: []
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [pending, approved, rejected]
    responses:
      '200':
        description: Status updated

/api/oas/application-by-id/{applicationId}/pdf:
  get:
    tags:
      - OAS
    summary: Export application as PDF
    security:
      - cookieAuth: []
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: PDF file
        content:
          application/pdf:
            schema:
              type: string
              format: binary

/api/oas/application/{applicationId}:
  delete:
    tags:
      - OAS
    summary: Delete application
    security:
      - cookieAuth: []
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        $ref: '../components/responses.yml#/DeletedResponse'

