application-pdf:
  get:
    tags:
      - Applications
    summary: Export application as PDF by ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      '200':
        description: PDF generated successfully
        content:
          application/pdf:
            schema:
              type: string
              format: binary

my-application-pdf:
  get:
    tags:
      - Applications
    summary: Export my application as PDF
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '200':
        description: PDF generated successfully
        content:
          application/pdf:
            schema:
              type: string
              format: binary

application-status:
  put:
    tags:
      - Applications
    summary: Update application status
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [pending, form_verified, document_verification, interview_scheduled, approved, rejected]
    responses:
      '200':
        description: Status updated successfully

application-approvals:
  put:
    tags:
      - Applications
    summary: Update application approvals
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              form:
                type: boolean
              documents:
                type: boolean
              interview:
                type: boolean
              final:
                type: boolean
    responses:
      '200':
        description: Approvals updated successfully

