application:
  post:
    tags:
      - Applications
    summary: Create a new application
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Application.yaml'
    responses:
      '201':
        description: Application created successfully
      '400':
        description: Bad request
  get:
    tags:
      - Applications
    summary: Get my application
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '200':
        description: Application retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                application:
                  $ref: '../components/schemas/Application.yaml'
      '404':
        description: Application not found
  patch:
    tags:
      - Applications
    summary: Update my application
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Application.yaml'
    responses:
      '200':
        description: Application updated successfully

all-applications:
  get:
    tags:
      - Applications
    summary: Get all applications (Admin)
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
    responses:
      '200':
        description: Applications retrieved successfully

application-by-id:
  get:
    tags:
      - Applications
    summary: Get application by ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Application retrieved successfully
      '404':
        description: Application not found
  patch:
    tags:
      - Applications
    summary: Update application by ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Application.yaml'
    responses:
      '200':
        description: Application updated successfully
  delete:
    tags:
      - Applications
    summary: Delete application by ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Application deleted successfully

application-by-user-id:
