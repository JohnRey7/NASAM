document-uploads:
  post:
    tags:
      - Document Uploads
    summary: Upload documents
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              files:
                type: array
                items:
                  type: string
                  format: binary
    responses:
      '201':
        description: Documents uploaded successfully
      '400':
        description: Bad request
  get:
    tags:
      - Document Uploads
    summary: Get my documents
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '200':
        description: Documents retrieved successfully
      '404':
        description: Documents not found

all-document-uploads:
  get:
    tags:
      - Document Uploads
    summary: Get all documents (Admin)
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
    responses:
      '200':
        description: Documents retrieved successfully

document-uploads-by-user:
  get:
    tags:
      - Document Uploads
    summary: Get documents by User ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Documents retrieved successfully

document-upload-by-user-id:
  patch:
    tags:
      - Document Uploads
    summary: Update document by User ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              files:
                type: array
                items:
                  type: string
                  format: binary
    responses:
      '200':
        description: Document updated successfully
  delete:
    tags:
      - Document Uploads
    summary: Delete document by User ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Document deleted successfully

end-term-grade:
