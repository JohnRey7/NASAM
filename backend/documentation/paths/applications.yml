/api/application/approvals:
  put:
    tags:
      - Applications
    summary: Set approval summary
    description: Set the approval summary for an application
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              applicationId:
                type: string
                example: "507f1f77bcf86cd799439011"
              isApproved:
                type: boolean
                example: true
              comments:
                type: string
                example: "All requirements met successfully"
            required:
              - applicationId
              - isApproved
    responses:
      '200':
        $ref: '../components/responses.yml#/UpdatedResponse'
      '400':
        $ref: '../components/responses.yml#/ValidationError'
      '401':
        $ref: '../components/responses.yml#/Unauthorized'
