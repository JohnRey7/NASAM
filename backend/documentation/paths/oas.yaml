applications:
  get:
    tags:
      - OAS
    summary: Get all applications for OAS staff
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '200':
        description: Applications retrieved successfully

application-documents:
  get:
    tags:
      - OAS
    summary: Get application documents by Application ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Documents retrieved successfully

application-status:
  patch:
    tags:
      - OAS
    summary: Update application status by Application ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum: [pending, form_verified, document_verification, interview_scheduled, approved, rejected]
    responses:
      '200':
        description: Status updated successfully

application-pdf:
  get:
    tags:
      - OAS
    summary: Export application as PDF by Application ID
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
    responses:
      '200':
        description: PDF generated successfully
        content:
          application/pdf:
            schema:
              type: string
              format: binary

